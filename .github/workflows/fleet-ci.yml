# Fleet standard CI — self-hosted via gha-runner-ctl (Podman work containers).
# Labels match the retain runner: self-hosted, linux, x64, podman.
# Do not add `large` until a runner actually registers that label.
# Gates (names match protec-main): detect stack, Rustfmt, Clippy,
# Documentation, Test Suite (stable). No --all-features (that pulls cuda).
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: d
        name: Detect stacks
        run: |
          set -euo pipefail
          rust=false; python=false
          if [ -f Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  fmt:
    name: Rustfmt
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - name: Prefer rustup 1.96.1 over image rustc 1.88
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - name: Prefer rustup 1.96.1 over image rustc 1.88
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: cargo clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Documentation
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prefer rustup 1.96.1 over image rustc 1.88
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo doc --workspace --no-deps

  rust:
    name: Test Suite (stable)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prefer rustup 1.96.1 over image rustc 1.88
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default 1.96.1
          rustc --version
          cargo --version
          rustc --version | grep -E 'rustc 1\.96'
      - name: cargo check
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets
      # CPU default. Do not add --all-features (pulls cuda → nvcc on CPU runners).
      - name: cargo test
        run: |
          set -euo pipefail
          cargo test --workspace

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Sync deps
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups || uv sync
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip (not a claimed gate)"
            echo "HONEST_CI class=SKIP_STUB detail=ruff_not_configured"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            if command -v uv >/dev/null 2>&1 && [ -f pyproject.toml ]; then
              uv run pytest -q
            else
              pytest -q
            fi
          else
            echo "no tests/ directory — skip"
            echo "HONEST_CI class=SKIP_STUB detail=no_tests_dir"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 5
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
          echo "HONEST_CI class=SKIP_STUB detail=no_stack"
