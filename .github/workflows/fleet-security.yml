# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
# See: gha-runner-ctl docs/HONEST_CI.md + FLEET_STANDARDS.md
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

# No concurrency cancel. Self-hosted jobs sat queued for hours; every PR
# synchronize then cancelled them before a runner started (`cancel-in-progress:
# true`). Let each run wait its turn on the homelab CPU runners.

permissions:
  contents: read

jobs:
  cargo-deny-licenses:
    name: cargo deny licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          rust-version: "1.96.1"

  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure gitleaks (pinned + checksum)
        run: |
          set -euo pipefail
          # Pin matches gha-runner-ctl packaging / fleet-security.
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          if command -v gitleaks >/dev/null 2>&1; then
            echo "using preinstalled $(command -v gitleaks)"
            exit 0
          fi
          install_dir="${RUNNER_TEMP:-/tmp}/gitleaks-bin"
          mkdir -p "$install_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp="${RUNNER_TEMP:-/tmp}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$tmp"
          echo "${GITLEAKS_SHA256}  ${tmp}" | sha256sum -c -
          tar -xzf "$tmp" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [ ! -f .gitleaks.toml ]; then
            echo "::error title=FAIL_ENV::missing .gitleaks.toml"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "gitleaks not available after install — FAIL (honest security gate)" >&2
            exit 1
          fi
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  trivy-fs-advisory:
    # Advisory: runner image has no trivy. Name contains "advisory" so
    # continue-on-error is honest. protec-main must not require this job.
    name: trivy filesystem (advisory)
    runs-on: [self-hosted, linux, x64, podman]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trivy fs
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            echo "trivy missing — advisory skip"
            echo "HONEST_CI class=SKIP_STUB detail=trivy_missing"
            exit 0
          fi
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
