# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
# See: gha-runner-ctl docs/HONEST_CI.md + FLEET_STANDARDS.md
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

# No concurrency cancel. Self-hosted jobs sat queued for hours; every PR
# synchronize then cancelled them before a runner started (`cancel-in-progress:
# true`). Let each run wait its turn on the homelab CPU runners.

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --verbose --redact
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source=/path --verbose --redact
          elif command -v podman >/dev/null 2>&1; then
            podman run --rm -v "$PWD:/path:ro" docker.io/zricethezav/gitleaks:latest detect --source=/path --verbose --redact
          else
            echo "::error title=FAIL_ENV::gitleaks not available on runner"
            echo "HONEST_CI class=FAIL_ENV detail=gitleaks_missing"
            exit 1
          fi

  trivy-fs-advisory:
    # Advisory: runner image has no trivy. Name contains "advisory" so
    # continue-on-error is honest. protec-main must not require this job.
    name: trivy filesystem (advisory)
    runs-on: [self-hosted, linux, x64, podman]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy fs
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            echo "trivy missing — advisory skip"
            echo "HONEST_CI class=SKIP_STUB detail=trivy_missing"
            exit 0
          fi
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
