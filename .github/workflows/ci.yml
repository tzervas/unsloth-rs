# RETIRED — do not expand.
# Product gates live in fleet-ci.yml + fleet-security.yml.
# This file is workflow_dispatch-only so it cannot refill the self-hosted queue.

name: CI (legacy — retired)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  notice:
    name: legacy CI retired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Legacy multi-job CI is retired."
          echo "Use fleet-ci.yml (fmt/clippy/doc/test, no --all-features) and fleet-security.yml."
          echo "HONEST_CI class=SKIP_STUB detail=legacy_ci_retired"
