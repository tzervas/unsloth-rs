# Thin caller — policy lives in tzervas/ap-workflows (reusable-ci-autodetect).
# Pin `@v0.1` is the fleet moving tag (0.x: minor is breaking).
#
# all-features: false — `--all-features` pulls `cuda` on this crate.
# rust label selects the fleet work image via host GHA_IMAGE_MAP.
# Hosted Test Suite stays local: it must not `needs: detect` on self-hosted.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      tier:
        description: "Force a tier (otherwise derived from the target branch)"
        type: choice
        options: [auto, dev, main]
        default: auto

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fleet-ci:
    uses: tzervas/ap-workflows/.github/workflows/reusable-ci-autodetect.yml@v0.1
    with:
      tier: ${{ inputs.tier || 'auto' }}
      rust-version: "1.96.1"
      all-features: false
      gpu: false
      bench: false
      runner-labels: '["self-hosted","linux","x64","podman","rust"]'

  hosted-test:
    name: Test Suite (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo test
        run: cargo test --workspace

  detect-stack:
    name: detect stack
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"

  rustfmt:
    name: Rustfmt
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"

  clippy:
    name: Clippy
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"

  docs:
    name: Documentation
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"

  tests-stable:
    name: Test Suite (stable)
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"
